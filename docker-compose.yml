services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver-2025
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlServer@2025!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  minio:
    # A imagem minio/minio foi removida do Docker Hub em set/2026; a mesma versão
    # continua publicada no Quay. Se o pull falhar, use o plano B do README
    # (docker-compose.minio-build.yml compila esta versão a partir do código-fonte).
    image: quay.io/minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "9020:9000"   # API S3
      - "9021:9001"   # Console web
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  sqlserver-data:
  minio-data:
