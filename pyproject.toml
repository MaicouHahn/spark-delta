[project]
name = "spark-delta"
version = "0.1.0"
description = "Trabalho 2 - Pipeline SQL Server -> MinIO (landing-zone/CSV) -> Delta Lake (bronze) com Apache Spark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Maicou Hahn Fortuna" },
    { name = "Guilherme Victor Machado" },
    { name = "Evandro Luiz Rodrigues Damazio" },
]
dependencies = [
    "boto3>=1.34.0",
    "delta-spark==3.2.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.5",
    "pandas>=2.2.0",
    "pyodbc>=5.1.0",
    "pyspark==3.5.3",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_delta"]
