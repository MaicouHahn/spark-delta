site_name: "Trabalho 2 - Spark, Delta Lake, MinIO e SQL Server"
site_description: Pipeline SQL Server -> MinIO (landing-zone) -> Delta Lake (bronze) com Apache Spark
site_author: Maicou Hahn Fortuna, Guilherme Victor Machado, Evandro Luiz Rodrigues Damazio
site_url: https://maicouhahn.github.io/spark-delta/
repo_url: https://github.com/MaicouHahn/spark-delta
repo_name: MaicouHahn/spark-delta
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight

nav:
  - Contexto: index.md
  - Arquitetura: arquitetura.md
  - Cenário e dados: dados.md
  - Tecnologias:
      - Apache Spark (PySpark): apache-spark.md
      - Delta Lake: delta-lake.md
      - MinIO: minio.md
  - Pipeline:
      - 1. Extração (SQL Server → landing-zone): extracao.md
      - 2. Conversão (landing-zone → bronze): bronze.md
      - 3. DML nas tabelas Delta: dml.md
  - Gerenciadas × não gerenciadas: tabelas-gerenciadas.md
  - Referências: referencias.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
